<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karachi Weather Prediction System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <script>
    window.API_BASE = (window.API_BASE || "").replace(/\/$/, "");
    const apiUrl = (path) => (window.API_BASE ? `${window.API_BASE}${path}` : path);
    (function () {
      const originalFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        if (typeof input === "string" && input.startsWith("/api/")) {
          input = apiUrl(input);
        }
        return originalFetch(input, init);
      };
    })();
  </script>
  <style>
    :root {
      --primary: #004f71;
      --secondary: #007ba7;
      --background: #fdfbf8;
      --surface: #ffffff;
      --text: #333333;
      --text-muted: #666666;
      --shadow: rgba(0, 79, 113, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", sans-serif;
      background: var(--background);
      color: var(--text);
    }
    header {
      background: rgba(255,255,255,0.9);
      padding: 1.5rem 2rem;
      box-shadow: 0 6px 20px var(--shadow);
      text-align: center;
    }
    .title { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .subtitle { margin-top: 0.25rem; color: var(--text-muted); }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 8px 20px var(--shadow);
    }
    .card h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--primary); }
    .temp { font-size: 3rem; font-weight: 700; margin: 0.5rem 0; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-top: 1rem; }
    .stat { background: #f7fbfd; border-radius: 10px; padding: 0.75rem; text-align: center; }
    .stat strong { display: block; font-size: 1.1rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
    .btn {
      border: none; background: var(--primary); color: #fff; padding: 0.75rem 1rem;
      border-radius: 10px; cursor: pointer; font-weight: 600;
    }
    .btn.secondary { background: var(--secondary); }
    .btn.ghost { background: #e9f4f9; color: var(--primary); }
    .list { display: grid; gap: 0.5rem; margin-top: 1rem; }
    .list-item { display: flex; justify-content: space-between; background: #f7fbfd; padding: 0.6rem 0.75rem; border-radius: 8px; }
    .metrics { display: grid; gap: 0.75rem; }
    .progress { height: 8px; background: #e6eef2; border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--secondary); width: 0%; }
    .footer { text-align: center; color: var(--text-muted); margin: 2rem 0; }
  </style>
</head>
<body>
  <header>
    <div class="title">Karachi Weather Prediction System</div>
    <div class="subtitle" id="currentLocation"></div>
    <div class="subtitle" id="lastUpdate"></div>
  </header>

  <main class="container">
    <div class="grid">
      <section class="card">
        <h2>Live Weather</h2>
        <div id="weatherCondition">Loading...</div>
        <div class="temp" id="currentTemp">--°C</div>
        <div class="stats">
          <div class="stat"><strong id="humidity">--%</strong>Humidity</div>
          <div class="stat"><strong id="pressure">--</strong>Pressure</div>
          <div class="stat"><strong id="windSpeed">--</strong>Wind</div>
          <div class="stat"><strong id="precipitation">--</strong>Rain</div>
          <div class="stat"><strong id="cloudCover">--%</strong>Cloud</div>
          <div class="stat"><strong id="feelsLike">--°C</strong>Feels Like</div>
        </div>
        <div class="actions">
          <button class="btn" id="refresh-button"><i class="fa-solid fa-rotate"></i> Refresh</button>
          <button class="btn secondary" id="forecast-24h-btn"><i class="fa-solid fa-chart-line"></i> 24h Forecast</button>
          <button class="btn ghost" id="retrain-button"><i class="fa-solid fa-brain"></i> Retrain</button>
        </div>
      </section>

      <section class="card">
        <h2>24‑Hour Forecast</h2>
        <div class="list" id="forecastList"></div>
      </section>

      <section class="card">
        <h2>Model Metrics</h2>
        <div class="metrics">
          <div>
            <strong>R² Score</strong>
            <div id="r2Score">--</div>
            <div class="progress"><span id="r2Progress"></span></div>
          </div>
          <div><strong>RMSE</strong> <span id="rmse">--</span></div>
          <div><strong>MAE</strong> <span id="mae">--</span></div>
          <div><strong>Accuracy</strong> <span id="accuracy">--</span></div>
        </div>
      </section>
    </div>
  </main>

  <div class="footer">Powered by Open‑Meteo + ML Ensemble</div>

  <script src="ui_integration_example.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof initializeUI === "function") {
        initializeUI();
      } else {
        console.error("initializeUI not found. Make sure ui_integration_example.js is loaded.");
      }
    });
  </script>
</body>
</html>
